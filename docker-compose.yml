# docker compose up --build
#   API          http://localhost:8080
#   Grafana      http://localhost:3001  (dashboard "Ledger", no login)
#   Prometheus   http://localhost:9090
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: ledger, POSTGRES_PASSWORD: ledger, POSTGRES_DB: ledger }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ledger"], interval: 2s, retries: 30 }
    command: ["postgres", "-c", "max_connections=200"]

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command: ["redpanda", "start", "--mode", "dev-container", "--smp", "1", "--kafka-addr", "0.0.0.0:9092", "--advertise-kafka-addr", "redpanda:9092"]
    healthcheck: { test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"], interval: 3s, retries: 30 }

  ledger:
    build: .
    environment:
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
